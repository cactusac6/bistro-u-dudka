function calcPrice(i){let p=i.product.price;if(i.size){let s=SIZE.find(o=>o.id===i.size);if(s)p+=s.extra}if(i.meat){let m=MEAT.find(o=>o.id===i.meat);if(m)p+=m.extra}if(i.extras)i.extras.forEach(e=>{p+=e.price});return p*i.qty}
function label(i){let p=[i.product.name];if(i.size){let s=SIZE.find(o=>o.id===i.size);if(s)p.push(s.name)}if(i.meat){let m=MEAT.find(o=>o.id===i.meat);if(m)p.push(m.name)}if(i.sauces&&i.sauces.length)p.push(i.sauces.join(", "));if(i.extras&&i.extras.length)p.push(i.extras.map(e=>e.name).join(", "));return p.join(" · ")}
function ckey(i){return i.product.id+"_"+(i.size||"")+"_"+(i.meat||"")+"_"+(i.sauces?i.sauces.join(","):"")+"_"+(i.extras?i.extras.map(e=>e.id).join(","):"")}
function obalFee(cart){const cnt=cart.reduce((s,i)=>s+i.qty,0);if(cnt===0)return 0;if(cnt<=2)return 10;if(cnt<=5)return 20;return 30}

function Img({src,alt,style:st}){
  const [err,setErr]=useState(false);
  if(!src||err)return <div style={{...st,background:`linear-gradient(135deg,${S.card2},${S.card})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:48}}>🍽️</div>;
  return <img src={src} alt={alt} style={{...st,objectFit:"cover"}} onError={()=>setErr(true)} loading="lazy"/>;
}

function CatBar({active,onSelect}){
  return <div style={{display:"flex",gap:8,overflowX:"auto",padding:"14px 16px",position:"sticky",top:0,zIndex:20,background:S.bg,borderBottom:"1px solid "+S.line}}>
    {CATEGORIES.map(c=><button key={c.id} onClick={()=>onSelect(c.id)} style={{flexShrink:0,padding:"10px 18px",borderRadius:999,cursor:"pointer",transition:"all .2s",border:active===c.id?"2px solid "+S.red:"1.5px solid "+S.line,background:active===c.id?`linear-gradient(135deg,${S.red},${S.redDeep})`:S.card,color:active===c.id?"#fff":S.ink,fontFamily:S.grot,fontWeight:700,fontSize:13,letterSpacing:".02em",boxShadow:active===c.id?"0 8px 22px -8px rgba(225,29,29,.5)":"none"}}>{c.name}</button>)}
  </div>;
}

function Card({product,onAdd}){
  const pt=(product.hasMeat||product.hasSize)?"od "+product.price:String(product.price);
  return <button onClick={()=>onAdd(product)} style={{display:"flex",alignItems:"center",gap:14,width:"100%",padding:0,background:`linear-gradient(180deg,${S.card},${S.card2})`,border:"1.5px solid "+S.line,borderRadius:14,cursor:"pointer",textAlign:"left",transition:".25s ease",overflow:"hidden"}}>
    <Img src={product.img} alt={product.name} style={{width:90,height:90,flexShrink:0,borderRadius:"12px 0 0 12px"}}/>
    <div style={{flex:1,minWidth:0,padding:"12px 4px"}}>
      <div style={{fontFamily:S.display,fontWeight:400,fontSize:16,color:S.ink,textTransform:"uppercase",letterSpacing:".01em",lineHeight:1.1}}>{product.name}</div>
      {product.desc&&<div style={{fontSize:12,color:S.muted,marginTop:4,fontFamily:S.body,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{product.desc}</div>}
    </div>
    <div style={{fontFamily:S.display,fontWeight:400,fontSize:18,color:S.gold,flexShrink:0,padding:"8px 16px 8px 8px",letterSpacing:".02em",whiteSpace:"nowrap"}}>{pt+" Kč"}</div>
  </button>;
}

function Chip({selected,onClick,children}){return <button onClick={onClick} style={{padding:"10px 18px",borderRadius:14,cursor:"pointer",transition:".2s ease",border:selected?"2px solid "+S.red:"1.5px solid "+S.line,background:selected?`linear-gradient(180deg,#1c0a0a,${S.card})`:S.card,color:selected?S.red:S.ink,fontFamily:S.grot,fontWeight:700,fontSize:14}}>{children}</button>}

function SauceRow({name,active,onClick}){return <button onClick={onClick} style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",padding:"14px 18px",borderRadius:14,cursor:"pointer",transition:".25s ease",background:active?`linear-gradient(180deg,#1c0a0a,${S.card})`:`linear-gradient(180deg,${S.card},${S.card2})`,border:active?"1.5px solid "+S.red:"1.5px solid "+S.line}}>
  <span style={{fontFamily:S.grot,fontWeight:700,fontSize:15,color:S.ink}}>{name}</span>
  <span style={{width:26,height:26,borderRadius:7,border:"2px solid "+S.red,background:active?S.red:"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:16,fontWeight:"bold",flexShrink:0}}>{active?"✓":""}</span>
</button>}

function ExtraRow({extra,active,onClick}){return <button onClick={onClick} style={{display:"flex",alignItems:"center",width:"100%",gap:14,padding:"14px 18px",borderRadius:14,cursor:"pointer",transition:".2s ease",background:active?"#1c0a0a":S.card,border:active?"1.5px solid "+S.red:"1.5px solid "+S.line}}>
  <span style={{width:24,height:24,borderRadius:6,border:"2px solid "+S.red,background:active?S.red:"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:15,fontWeight:"bold",flexShrink:0}}>{active?"✓":""}</span>
  <span style={{flex:1,fontFamily:S.grot,fontWeight:700,fontSize:15,color:S.ink,textAlign:"left"}}>{extra.name}</span>
  <span style={{fontFamily:S.display,fontSize:18,color:S.gold,fontWeight:400,whiteSpace:"nowrap"}}>{"+"+extra.price+" Kč"}</span>
</button>}

function Sec({children}){return <div style={{fontFamily:S.display,fontSize:22,fontWeight:400,color:S.ink,textTransform:"uppercase",marginTop:24,marginBottom:12}}>{children}</div>}

function Modal({product,onClose,onAdd}){
  const [size,setSize]=useState("standard");
  const [meat,setMeat]=useState("kureci");
  const [sauces,setSauces]=useState([]);
  const [extras,setExtras]=useState([]);
  const [qty,setQty]=useState(1);
  const showSize=product.hasSize;
  const showMeat=product.hasMeat;
  const showSauces=showMeat||product.hasSauceSelect;
  const showExtras=showMeat||product.hasExtras;
  const price=useMemo(()=>{let p=product.price;if(showSize){let s=SIZE.find(o=>o.id===size);if(s)p+=s.extra}if(showMeat){let m=MEAT.find(o=>o.id===meat);if(m)p+=m.extra}extras.forEach(e=>{p+=e.price});return p},[product,size,meat,extras,showSize,showMeat]);
  const toggleS=s=>{if(s==="Bez omáčky"){setSauces(p=>p.includes(s)?[]:[s]);return}setSauces(p=>{let w=p.filter(x=>x!=="Bez omáčky");return w.includes(s)?w.filter(x=>x!==s):[...w,s]})};
  const toggleE=ex=>{setExtras(p=>p.find(e=>e.id===ex.id)?p.filter(e=>e.id!==ex.id):[...p,ex])};
  return <div onClick={onClose} className="modal-overlay" style={{position:"fixed",inset:0,background:"rgba(10,8,7,.78)",backdropFilter:"blur(12px)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
    <div onClick={e=>e.stopPropagation()} className="modal-box" style={{background:S.bg,borderRadius:"24px 24px 0 0",width:"100%",maxWidth:560,maxHeight:"92vh",overflowY:"auto",padding:"28px 24px 34px",border:"1px solid "+S.line}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
        <Img src={product.img} alt={product.name} style={{width:100,height:100,borderRadius:16}}/>
        <button onClick={onClose} style={{width:42,height:42,borderRadius:"50%",background:S.card,border:"1px solid "+S.lineS,color:S.ink,fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
      </div>
      <h2 style={{margin:0,fontFamily:S.display,fontSize:30,fontWeight:400,color:S.ink,textTransform:"uppercase",lineHeight:.95}}>{product.name}</h2>
      {product.desc&&<p style={{margin:"8px 0 0",color:S.muted,fontSize:15,fontFamily:S.body}}>{product.desc}</p>}
      {showSize&&<><Sec>Velikost</Sec><div style={{display:"flex",gap:10}}>{SIZE.map(o=><Chip key={o.id} selected={size===o.id} onClick={()=>setSize(o.id)}>{o.name+(o.extra?" (+"+o.extra+" Kč)":"")}</Chip>)}</div></>}
      {showMeat&&<><Sec>Maso</Sec><div style={{display:"flex",gap:10}}>{MEAT.map(o=><Chip key={o.id} selected={meat===o.id} onClick={()=>setMeat(o.id)}>{o.name+(o.extra?" (+"+o.extra+" Kč)":"")}</Chip>)}</div></>}
      {showSauces&&<><Sec>Omáčka</Sec><div style={{display:"flex",flexDirection:"column",gap:8}}>{SAUCES.map(s=><SauceRow key={s} name={s} active={sauces.includes(s)} onClick={()=>toggleS(s)}/>)}</div></>}
      {showExtras&&<><Sec>Něco navíc?</Sec><div style={{display:"flex",flexDirection:"column",gap:8}}>{EXTRAS.map(ex=><ExtraRow key={ex.id} extra={ex} active={!!extras.find(e=>e.id===ex.id)} onClick={()=>toggleE(ex)}/>)}</div></>}
      <div style={{display:"flex",alignItems:"center",gap:14,marginTop:28}}>
        <div style={{display:"flex",alignItems:"center",background:S.card,border:"1px solid "+S.lineS,borderRadius:12,overflow:"hidden"}}>
          <button onClick={()=>setQty(Math.max(1,qty-1))} style={{width:44,height:44,border:"none",background:"transparent",fontSize:22,fontWeight:700,cursor:"pointer",color:S.ink}}>−</button>
          <span style={{width:40,textAlign:"center",fontFamily:S.display,fontSize:18,color:S.ink}}>{qty}</span>
          <button onClick={()=>setQty(qty+1)} style={{width:44,height:44,border:"none",background:"transparent",fontSize:22,fontWeight:700,cursor:"pointer",color:S.ink}}>+</button>
        </div>
        <button onClick={()=>{onAdd({product,qty,size:showSize?size:null,meat:showMeat?meat:null,sauces:sauces.length?sauces:null,extras:extras.length?extras:null});onClose()}} style={{flex:1,padding:"16px 0",borderRadius:14,border:"none",background:S.red,color:"#fff",fontFamily:S.grot,fontWeight:800,fontSize:15,letterSpacing:".06em",textTransform:"uppercase",cursor:"pointer",boxShadow:"0 16px 32px -10px rgba(225,29,29,.55)"}}>{"Přidat · "+(price*qty)+" Kč"}</button>
      </div>
    </div>
  </div>;
}

function CartView({cart,onClose,onQty,onRm,onCheckout,onQuick}){
  const sub=cart.reduce((s,i)=>s+calcPrice(i),0);
  const obal=obalFee(cart);
  const total=sub+obal;
  return <div onClick={onClose} className="modal-overlay" style={{position:"fixed",inset:0,background:"rgba(10,8,7,.78)",backdropFilter:"blur(12px)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
    <div onClick={e=>e.stopPropagation()} className="modal-box" style={{background:S.bg,borderRadius:"24px 24px 0 0",width:"100%",maxWidth:560,maxHeight:"85vh",display:"flex",flexDirection:"column",border:"1px solid "+S.line}}>
      <div style={{padding:"22px 20px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <h2 style={{margin:0,fontFamily:S.display,fontSize:28,fontWeight:400,color:S.ink,textTransform:"uppercase"}}>🛒 Košík</h2>
        <button onClick={onClose} style={{width:42,height:42,borderRadius:"50%",background:S.card,border:"1px solid "+S.lineS,color:S.ink,fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"16px 20px"}}>
        {cart.length===0&&<p style={{color:S.muted,textAlign:"center",padding:40}}>Košík je prázdný</p>}
        {cart.map((item,i)=><div key={ckey(item)} style={{display:"flex",alignItems:"center",gap:10,padding:"14px 0",borderBottom:i<cart.length-1?"1px solid "+S.line:"none"}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontFamily:S.grot,fontWeight:700,fontSize:14,color:S.ink,lineHeight:1.3}}>{label(item)}</div>
            <div style={{fontFamily:S.display,fontSize:16,color:S.gold,marginTop:4}}>{calcPrice(item)+" Kč"}</div>
          </div>
          <div style={{display:"flex",alignItems:"center",background:S.card,border:"1px solid "+S.lineS,borderRadius:10,overflow:"hidden"}}>
            <button onClick={()=>item.qty<=1?onRm(ckey(item)):onQty(ckey(item),item.qty-1)} style={{width:34,height:34,border:"none",background:"transparent",fontSize:16,cursor:"pointer",color:S.ink}}>{item.qty<=1?"🗑":"−"}</button>
            <span style={{width:28,textAlign:"center",fontSize:14,fontWeight:700,color:S.ink}}>{item.qty}</span>
            <button onClick={()=>onQty(ckey(item),item.qty+1)} style={{width:34,height:34,border:"none",background:"transparent",fontSize:16,cursor:"pointer",color:S.ink}}>+</button>
          </div>
        </div>)}
        {cart.length>0&&<div style={{marginTop:20,paddingTop:16,borderTop:"1px solid "+S.line}}>
          <div style={{fontFamily:S.grot,fontSize:11,fontWeight:800,letterSpacing:".2em",textTransform:"uppercase",color:S.red,marginBottom:12}}>— Přidat k objednávce</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {UPSELL.map(u=><button key={u.id} onClick={()=>onQuick(u)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px",borderRadius:12,cursor:"pointer",background:S.card,border:"1.5px solid "+S.line}}>
              <span style={{fontFamily:S.grot,fontWeight:700,fontSize:13,color:S.ink}}>{u.name}</span>
              <span style={{fontFamily:S.display,fontSize:15,color:S.gold,marginLeft:8}}>{"+"+u.price+" Kč"}</span>
            </button>)}
          </div>
        </div>}
      </div>
      {cart.length>0&&<div style={{padding:"16px 20px 26px",borderTop:"1px solid "+S.line}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
          <span style={{fontFamily:S.grot,fontSize:14,fontWeight:600,color:S.muted}}>{"📦 Obal ("+cart.reduce((s,i)=>s+i.qty,0)+" ks)"}</span>
          <span style={{fontFamily:S.display,fontSize:16,color:S.muted}}>{obal+" Kč"}</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}>
          <span style={{fontFamily:S.display,fontSize:20,color:S.ink,textTransform:"uppercase"}}>Celkem</span>
          <span style={{fontFamily:S.display,fontSize:22,color:S.gold}}>{total+" Kč"}</span>
        </div>
        <button onClick={()=>{if(!ORDERS_LOCKED)onCheckout()}} disabled={ORDERS_LOCKED} style={{width:"100%",padding:"16px 0",borderRadius:14,border:"none",background:ORDERS_LOCKED?S.line:S.red,color:ORDERS_LOCKED?S.muted:"#fff",fontFamily:S.grot,fontWeight:800,fontSize:15,letterSpacing:".08em",textTransform:"uppercase",cursor:ORDERS_LOCKED?"not-allowed":"pointer",boxShadow:ORDERS_LOCKED?"none":"0 16px 32px -10px rgba(225,29,29,.55)"}}>{ORDERS_LOCKED?"🔒 Objednávky pozastaveny":"Pokračovat k objednávce"}</button>
      </div>}
    </div>
  </div>;
}

function PscDrop({value,onSelect}){
  const [open,setOpen]=useState(false);
  return <div style={{position:"relative"}}>
    <button onClick={()=>setOpen(!open)} style={{width:"100%",padding:"14px 16px",borderRadius:12,textAlign:"left",border:"1.5px solid "+S.lineS,background:S.card,color:value?S.ink:S.muted,fontSize:15,fontFamily:S.grot,fontWeight:600,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <span>{value||"Zadejte PSČ nebo klikněte"}</span>
      <span style={{fontSize:12,transform:open?"rotate(180deg)":"none",transition:".2s"}}>▼</span>
    </button>
    {open&&<div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:10,background:S.card,border:"1px solid "+S.lineS,borderRadius:12,marginTop:4,maxHeight:280,overflowY:"auto",boxShadow:"0 12px 32px rgba(0,0,0,.6)"}}>
      {ZONES.map((z,idx)=>{
        const showG=idx===0||z.group!==ZONES[idx-1].group;
        return <div key={z.psc}>
          {showG&&<div style={{padding:"10px 14px 4px",fontFamily:S.grot,fontSize:10,fontWeight:800,letterSpacing:".2em",textTransform:"uppercase",color:S.red}}>{z.group}</div>}
          <div onClick={()=>{onSelect(z);setOpen(false)}} style={{padding:"12px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",borderBottom:"1px solid "+S.line}}>
            <span style={{fontFamily:S.grot,fontSize:14,fontWeight:600,color:S.ink}}>{z.label+" — "+z.name}</span>
            <span style={{fontFamily:S.display,fontSize:14,color:S.gold,whiteSpace:"nowrap"}}>{z.fee+" Kč"}</span>
          </div>
        </div>;
      })}
    </div>}
  </div>;
}

function Checkout({cart,onClose,onDone}){
  const [mode,setMode]=useState("pickup");
  const [zone,setZone]=useState(null);
  const [name,setName]=useState("");
  const [phone,setPhone]=useState("");
  const [note,setNote]=useState("");
  const [street,setStreet]=useState("");
  const [sending,setSending]=useState(false);
  const [sendErr,setSendErr]=useState("");
  const sub=cart.reduce((s,i)=>s+calcPrice(i),0);
  const obal=obalFee(cart);
  const isJ=zone&&zone.psc==="55101";
  const free=sub>=400&&isJ;
  const fee=mode==="delivery"&&zone&&!free?zone.fee:0;
  const total=sub+obal+fee;
  const ok=name.trim()&&phone.trim().length>=9&&(mode==="pickup"||(mode==="delivery"&&zone&&street.trim()));
  const inp={width:"100%",padding:"14px 16px",borderRadius:12,border:"1.5px solid "+S.lineS,background:S.card,color:S.ink,fontSize:15,outline:"none",boxSizing:"border-box",fontFamily:S.grot,fontWeight:600};
  return <div onClick={onClose} className="modal-overlay" style={{position:"fixed",inset:0,background:"rgba(10,8,7,.78)",backdropFilter:"blur(12px)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
    <div onClick={e=>e.stopPropagation()} className="modal-box" style={{background:S.bg,borderRadius:"24px 24px 0 0",width:"100%",maxWidth:560,maxHeight:"90vh",overflowY:"auto",padding:"28px 24px 34px",border:"1px solid "+S.line}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
        <h2 style={{margin:0,fontFamily:S.display,fontSize:28,fontWeight:400,color:S.ink,textTransform:"uppercase"}}>Objednávka</h2>
        <button onClick={onClose} style={{width:42,height:42,borderRadius:"50%",background:S.card,border:"1px solid "+S.lineS,color:S.ink,fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
      </div>
      <div style={{display:"flex",gap:10,marginBottom:24}}>
        {[["pickup","🏪 Osobní odběr"],["delivery","🚚 Dovoz"]].map(([m,l])=><button key={m} onClick={()=>setMode(m)} style={{flex:1,padding:"14px 0",borderRadius:14,cursor:"pointer",border:mode===m?"2px solid "+S.red:"1.5px solid "+S.line,background:mode===m?`linear-gradient(135deg,${S.red},${S.redDeep})`:S.card,color:mode===m?"#fff":S.ink,fontFamily:S.grot,fontWeight:800,fontSize:14,textTransform:"uppercase"}}>{l}</button>)}
      </div>
      {mode==="delivery"&&<div style={{marginBottom:18}}>
        <div style={{fontSize:11,fontWeight:800,color:S.red,marginBottom:8,fontFamily:S.grot,letterSpacing:".2em",textTransform:"uppercase"}}>🚚 Zvolte způsob dopravy</div>
        <PscDrop value={zone?zone.label+" — "+zone.name:""} onSelect={setZone}/>
        {zone&&<div style={{color:S.gold,fontSize:13,marginTop:8,fontWeight:700,fontFamily:S.body}}>{"✓ "+zone.name+" — doprava "+(free?"ZDARMA (nad 400 Kč)":zone.fee+" Kč")}</div>}
        <div style={{fontSize:11,fontWeight:800,color:S.red,marginBottom:8,marginTop:16,fontFamily:S.grot,letterSpacing:".2em",textTransform:"uppercase"}}>Ulice a číslo *</div>
        <input value={street} onChange={e=>setStreet(e.target.value)} placeholder="Náchodská 571" style={inp}/>
      </div>}
      <div style={{fontSize:11,fontWeight:800,color:S.muted,marginBottom:8,fontFamily:S.grot,letterSpacing:".2em",textTransform:"uppercase"}}>Jméno *</div>
      <input value={name} onChange={e=>setName(e.target.value)} placeholder="Jan Novák" style={{...inp,marginBottom:14}}/>
      <div style={{fontSize:11,fontWeight:800,color:S.muted,marginBottom:8,fontFamily:S.grot,letterSpacing:".2em",textTransform:"uppercase"}}>Telefon *</div>
      <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="+420 123 456 789" style={{...inp,marginBottom:14}}/>
      <div style={{fontSize:11,fontWeight:800,color:S.muted,marginBottom:8,fontFamily:S.grot,letterSpacing:".2em",textTransform:"uppercase"}}>Poznámka</div>
      <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="Bez cibule, extra pálivé…" rows={2} style={{...inp,resize:"vertical",marginBottom:22}}/>
      {/* Summary */}
      <div style={{background:S.card,borderRadius:16,padding:18,marginBottom:18,border:"1.5px solid "+S.line}}>
        {cart.map(item=><div key={ckey(item)} style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",fontSize:14,marginBottom:8,gap:12}}>
          <span style={{color:S.ink,fontFamily:S.grot,fontWeight:600,flex:1,minWidth:0}}>{item.qty+"× "+label(item)}</span>
          <span style={{fontFamily:S.display,color:S.gold,whiteSpace:"nowrap",flexShrink:0}}>{calcPrice(item)+" Kč"}</span>
        </div>)}
        {mode==="delivery"&&zone&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",fontSize:14,marginBottom:8}}>
          <span style={{color:S.ink,fontFamily:S.grot,fontWeight:600}}>Doprava</span>
          <span style={{fontFamily:S.display,color:free?"#3fcf6a":S.gold,whiteSpace:"nowrap"}}>{free?"ZDARMA":fee+" Kč"}</span>
        </div>}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",fontSize:14,marginBottom:8}}>
          <span style={{color:S.muted,fontFamily:S.grot,fontWeight:600}}>{"📦 Obal ("+cart.reduce((s,i)=>s+i.qty,0)+" ks)"}</span>
          <span style={{fontFamily:S.display,color:S.muted,whiteSpace:"nowrap"}}>{obal+" Kč"}</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",fontSize:20,marginTop:12,paddingTop:12,borderTop:"1px solid "+S.line}}>
          <span style={{fontFamily:S.display,color:S.ink,textTransform:"uppercase"}}>Celkem</span>
          <span style={{fontFamily:S.display,color:S.gold,whiteSpace:"nowrap"}}>{total+" Kč"}</span>
        </div>
      </div>
      <div style={{fontSize:13,color:S.muted,marginBottom:16,textAlign:"center",fontFamily:S.body}}>{"💵 Platba při "+(mode==="delivery"?"převzetí":"odběru")+" hotově nebo kartou"}</div>
      <div style={{fontSize:11,color:S.muted,marginBottom:16,textAlign:"center",fontFamily:S.body}}>Odesláním objednávky souhlasíte s <a href="../obchodni-podminky.html" style={{color:S.gold}}>obchodními podmínkami</a> a se <a href="../ochrana-osobnich-udaju.html" style={{color:S.gold}}>zpracováním osobních údajů</a>. Jídla mohou obsahovat alergeny — na vyžádání vám je rádi sdělíme.</div>
      {sendErr&&<div style={{background:"#3a1111",border:"1px solid #e11d1d",borderRadius:12,padding:"12px 16px",marginBottom:12,color:"#ff6b6b",fontSize:13,fontFamily:S.body,textAlign:"center"}}>{sendErr}</div>}
      {ORDERS_LOCKED&&<div style={{background:"#3a1111",border:"1px solid #e11d1d",borderRadius:12,padding:"12px 16px",marginBottom:12,color:"#ff6b6b",fontSize:13,fontFamily:S.body,textAlign:"center"}}>🔒 Online objednávky brzy spouštíme. Díky za trpělivost!</div>}
      <button onClick={()=>{if(ORDERS_LOCKED||!ok||sending)return;setSending(true);setSendErr("");const orderData={mode,name,phone,note,street,psc:zone?zone.label:null,deliveryFee:fee,obalFee:obal,total,itemsText:cart.map(i=>i.qty+"× "+label(i)+" — "+calcPrice(i)+" Kč").join("\n"),items:cart};if(!API){onDone(orderData);return}fetch(API,{method:"POST",body:JSON.stringify(orderData),headers:{"Content-Type":"text/plain;charset=utf-8"}}).then(r=>r.text()).then(t=>{let d;try{d=JSON.parse(t)}catch(e){d={ok:true}}if(d.ok!==false){orderData.orderId=d.id||"";onDone(orderData)}else{setSendErr("Chyba: "+(d.error||"neznámá"));setSending(false)}}).catch(()=>{setSendErr("Nepodařilo se odeslat. Zkuste to znovu.");setSending(false)})}} disabled={ORDERS_LOCKED||!ok||sending} style={{width:"100%",padding:"18px 0",borderRadius:14,border:"none",background:!ORDERS_LOCKED&&ok&&!sending?S.red:S.line,color:!ORDERS_LOCKED&&ok&&!sending?"#fff":S.muted,fontFamily:S.grot,fontWeight:800,fontSize:16,letterSpacing:".08em",textTransform:"uppercase",cursor:!ORDERS_LOCKED&&ok&&!sending?"pointer":"not-allowed",boxShadow:!ORDERS_LOCKED&&ok&&!sending?"0 16px 32px -10px rgba(225,29,29,.55)":"none"}}>{ORDERS_LOCKED?"🔒 Pozastaveno":sending?"Odesílám…":"Odeslat objednávku"}</button>
    </div>
  </div>;
}

function Done({order,onReset}){
  return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"80vh",padding:24,textAlign:"center"}}>
    <div style={{width:80,height:80,borderRadius:"50%",background:"linear-gradient(135deg,#3fcf6a,#2a9e4a)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:36,marginBottom:20}}>✓</div>
    <h1 style={{fontFamily:S.display,fontSize:32,fontWeight:400,color:S.ink,margin:"0 0 8px",textTransform:"uppercase"}}>Objednávka přijata!</h1>
    {order.orderId&&<div style={{fontFamily:S.grot,fontSize:13,color:S.gold,fontWeight:700,letterSpacing:".1em",marginBottom:8}}>{order.orderId}</div>}
    <p style={{color:S.muted,fontSize:15,maxWidth:340,marginBottom:28,fontFamily:S.body}}>{"Díky, "+order.name+"! "+(order.mode==="delivery"?"Objednávku dovezeme na adresu "+order.street+".":"Objednávku si vyzvednete na provozovně.")}</p>
    <div style={{background:S.card,borderRadius:16,padding:20,width:"100%",maxWidth:400,border:"1.5px solid "+S.line,textAlign:"left",marginBottom:28}}>
      {order.items.map(item=><div key={ckey(item)} style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",fontSize:14,marginBottom:8,gap:12}}>
        <span style={{color:S.ink,fontFamily:S.grot,fontWeight:600,flex:1,minWidth:0}}>{item.qty+"× "+label(item)}</span>
        <span style={{fontFamily:S.display,color:S.gold,whiteSpace:"nowrap",flexShrink:0}}>{calcPrice(item)+" Kč"}</span>
      </div>)}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",fontSize:14,marginBottom:8}}>
        <span style={{color:S.muted,fontFamily:S.grot,fontWeight:600}}>{"📦 Obal"}</span>
        <span style={{fontFamily:S.display,color:S.muted}}>{obalFee(order.items)+" Kč"}</span>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",fontSize:20,marginTop:12,paddingTop:12,borderTop:"1px solid "+S.line}}>
        <span style={{fontFamily:S.display,color:S.ink,textTransform:"uppercase"}}>Celkem</span>
        <span style={{fontFamily:S.display,color:S.gold}}>{order.total+" Kč"}</span>
      </div>
    </div>
    <button onClick={onReset} style={{padding:"16px 44px",borderRadius:14,border:"none",background:S.red,color:"#fff",fontFamily:S.grot,fontWeight:800,fontSize:14,textTransform:"uppercase",cursor:"pointer"}}>Nová objednávka</button>
    <a href="/" style={{marginTop:16,color:S.muted,fontFamily:S.grot,fontSize:13,fontWeight:600,letterSpacing:".08em",textTransform:"uppercase",textDecoration:"none"}}>← Zpět na bistroududka.cz</a>
  </div>;
}

function App(){
  const [cat,setCat]=useState("durum");
  const [cart,setCart]=useState([]);
  const [sel,setSel]=useState(null);
  const [showCart,setShowCart]=useState(false);
  const [showCO,setShowCO]=useState(false);
  const [order,setOrder]=useState(null);
  const [,forceTick]=useState(0);
  useEffect(()=>{
    function check(){
      fetch(API+"?action=orderStatus").then(r=>r.json()).then(d=>{
        ORDERS_LOCKED=d.enabled===false;
        forceTick(t=>t+1);
      }).catch(()=>{});
    }
    check();
    const iv=setInterval(check,30000);
    return ()=>clearInterval(iv);
  },[]);
  const items=PRODUCTS.filter(p=>p.cat===cat);
  const cnt=cart.reduce((s,i)=>s+i.qty,0);
  const tot=cart.reduce((s,i)=>s+calcPrice(i),0)+obalFee(cart);
  const add=item=>{const k=ckey(item);setCart(p=>{const e=p.find(i=>ckey(i)===k);if(e)return p.map(i=>ckey(i)===k?{...i,qty:i.qty+item.qty}:i);return[...p,item]})};
  const quick=u=>add({product:{id:u.id,name:u.name,price:u.price},qty:1,size:null,meat:null,sauces:null,extras:null});
  const updQ=(k,q)=>setCart(p=>p.map(i=>ckey(i)===k?{...i,qty:q}:i));
  const rm=k=>setCart(p=>p.filter(i=>ckey(i)!==k));
  if(order)return <div style={{fontFamily:S.body,minHeight:"100vh",background:S.bg}}><Done order={order} onReset={()=>setOrder(null)}/></div>;
  return <div style={{fontFamily:S.body,minHeight:"100vh",background:S.bg,paddingBottom:cart.length>0?82:20}}>
    <div style={{padding:"24px 16px 12px",textAlign:"center"}}>
      <a href="/" style={{textDecoration:"none"}}>
        <div style={{fontFamily:S.display,fontSize:26,fontWeight:400,color:S.ink,textTransform:"uppercase",letterSpacing:".005em",lineHeight:.95}}>Bistro u Dudka</div>
      </a>
      <div style={{fontFamily:S.grot,fontSize:11,color:S.gold,fontWeight:700,letterSpacing:".18em",textTransform:"uppercase",marginTop:4}}>Jaroměř · Objednávka online</div>
    </div>
    {ORDERS_LOCKED&&<div style={{background:"linear-gradient(135deg,#3a1111,#1c0a0a)",border:"1.5px solid #e11d1d",borderRadius:12,padding:"14px 18px",margin:"0 16px 12px",textAlign:"center"}}>
      <div style={{fontFamily:S.grot,fontWeight:800,fontSize:14,color:"#e11d1d",textTransform:"uppercase",letterSpacing:".08em"}}>Brzy v provozu</div>
      <div style={{fontFamily:S.body,fontSize:13,color:S.muted,marginTop:4}}>Online objednávky zatím nejsou spuštěné. Menu si zatím jen prohlédněte, brzy budete moct objednávat.</div>
    </div>}
    <CatBar active={cat} onSelect={setCat}/>
    <div style={{padding:"14px 16px",display:"flex",flexDirection:"column",gap:10}}>
      {items.length===0&&<p style={{color:S.muted,textAlign:"center",padding:40}}>Žádné produkty v kategorii</p>}
      {items.map(p=><Card key={p.id} product={p} onAdd={setSel}/>)}
    </div>
    {cart.length>0&&<button onClick={()=>setShowCart(true)} style={{position:"fixed",bottom:16,left:16,right:16,maxWidth:560,margin:"0 auto",padding:"16px 22px",borderRadius:16,border:"none",background:S.red,color:"#fff",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 8px 32px rgba(225,29,29,.55)",zIndex:50}}>
      <span style={{fontFamily:S.grot,fontWeight:800,fontSize:14,letterSpacing:".06em",textTransform:"uppercase"}}>{"🛒 Košík ("+cnt+")"}</span>
      <span style={{fontFamily:S.display,fontWeight:400,fontSize:20}}>{tot+" Kč"}</span>
    </button>}
    {sel&&<Modal product={sel} onClose={()=>setSel(null)} onAdd={add}/>}
    {showCart&&<CartView cart={cart} onClose={()=>setShowCart(false)} onQty={updQ} onRm={rm} onCheckout={()=>{setShowCart(false);setShowCO(true)}} onQuick={quick}/>}
    {showCO&&<Checkout cart={cart} onClose={()=>setShowCO(false)} onDone={o=>{setOrder(o);setShowCO(false);setCart([])}}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
